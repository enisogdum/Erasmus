<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise B - Layouts Side by Side</title>
  <link rel="stylesheet" href="image_layouts_exercise.css">
</head>
<body>

<h1>Exercise B - Image Layouts</h1>

<!-- ================= GRID LAYOUT ================= -->
<h2>Grid Layout</h2>
<div class="layout-pair">
  <!-- Original -->
  <div class="container grid">
    <div class="img">1</div>
    <div class="img">2</div>
    <div class="img">3</div>
    <div class="img">4</div>
    <div class="img">5</div>
    <div class="img">6</div>
    <div class="img">7</div>
    <div class="img">8</div>
    <div class="img">9</div>
  </div>

  <!-- Modified (with letter) -->
  <div class="container grid">
    <div class="img">1</div>
    <div class="img">2</div>
    <div class="img">3</div>
    <div class="img">4</div>
    <div class="img special">A</div>
    <div class="img">5</div>
    <div class="img">6</div>
    <div class="img">7</div>
    <div class="img">8</div>
    <div class="img">9</div>
  </div>
</div>

<!-- ================= HORIZONTAL LAYOUT ================= -->

    <div class="img">1</div>

    <div class="img">6</div>
    <div class="img">7</div>
    <div class="img">8</div>
    <div class="img">9</div>
  </div>

  <div class="container horizontal">
    <div class="img">1</div>
    <div class="img">2</div>
    <div class="img">3</div>
    <div class="img">4</div>
    <div class="img special">A</div>
    <div class="img">5</div>
    <div class="img">6</div>
    <div class="img">7</div>
    <div class="img">8</div>
    <div class="img">9</div>
  </div>
</div>

<!-- ================= VERTICAL LAYOUT ================= -->
<h2>Vertical Layout</h2>
<div class="layout-pair">
  <div class="container vertical">
    <div class="img">1</div>
    <div class="img">2</div>
    <div class="img">3</div>
    <div class="img">4</div>
    <div class="img">5</div>
    <div class="img">6</div>
    <div class="img">7</div>
    <div class="img">8</div>

  </div>

  <div class="container vertical">
    <div class="img">1</div>
    <div class="img">2</div>
    <div class="img">3</div>
    <div class="img">4</div>
    <div class="img special">A</div>
    <div class="img">5</div>
    <div class="img">6</div>
    <div class="img">7</div>
    <div class="img">8</div>
    <div class="img">9</div>
  </div>
</div>

</body>
