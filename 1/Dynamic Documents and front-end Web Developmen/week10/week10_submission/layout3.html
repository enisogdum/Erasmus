<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Gallery</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>Travel Photography Portfolio</h1>
    <div class="gallery-grid">
        <div class="gallery-item">
            <img src="images/gallery1.jpg" alt="Paris Street">
        </div>
        <div class="gallery-item tall">
            <img src="images/gallery2.jpg" alt="Skyscraper">
        </div>
        <div class="gallery-item">
            <img src="images/gallery3.jpg" alt="Coffee Shop">
        </div>
        <div class="gallery-item wide">
            <img src="images/gallery4.jpg" alt="Mountain Panorama">
        </div>
        <div class="gallery-item big">
            <img src="images/gallery5.jpg" alt="City Skyline at Night">
        </div>
        <div class="gallery-item">
            <img src="images/gallery6.jpg" alt="Beach Sunset">
        </div>
        <div class="gallery-item">
            <img src="images/gallery7.jpg" alt="Forest Path">
        </div>
        <div class="gallery-item tall">
            <img src="images/gallery8.jpg" alt="Waterfall">
        </div>
        <div class="gallery-item">
            <img src="images/gallery9.jpg" alt="Desert Dunes">
        </div>
    </div>
</body>

</html>
